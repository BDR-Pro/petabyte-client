name: Release petabyte-client to PyPI (prod)

# PROD publishing for the petabyte CLI. The upstream monorepo is the TEST env (it ships every
# change to TestPyPI); THIS public repo ships real releases to PyPI on a cli-vX.Y.Z tag — the job
# fails if the tag and the pyproject `version` disagree, so a release can't ship the wrong number.
# Every push/PR still builds + smoke-runs the CLI first. The publish step is SKIPPED (not failed)
# until the prod token exists.
#
# SETUP: create a GitHub Environment `prod` (optionally with a Required reviewer so a release needs
# a click), and add the env secret PYPI_API_TOKEN (https://pypi.org/manage/account/token/). Or use
# Trusted Publishing (see the footer). Release: bump `version`, `git tag cli-v0.1.0 && git push --tags`.

on:
  push:
    branches: [main]
    tags: ["cli-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + smoke-run the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - run: |
          set -euo pipefail
          python -m venv /tmp/pbv
          /tmp/pbv/bin/pip install dist/*.whl
          /tmp/pbv/bin/petabyte --help >/dev/null
          echo "petabyte CLI installs and runs"

  publish-pypi:
    name: Publish release to PyPI
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli-v') }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the pyproject version
        run: |
          set -euo pipefail
          base=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "cli-v${base}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != cli-v${base}"; exit 1; }
      - run: |
          set -euo pipefail
          python -m pip install --upgrade pip build twine
          python -m build && twine check dist/*
      - name: Publish to PyPI (skipped if PYPI_API_TOKEN unset)
        env:
          PT: ${{ secrets.PYPI_API_TOKEN }}
        if: ${{ env.PT != '' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Note when no prod token is configured
        env:
          PT: ${{ secrets.PYPI_API_TOKEN }}
        if: ${{ env.PT == '' }}
        run: echo "::notice::Tag pushed but PYPI_API_TOKEN is not set — built + verified, not published."

# TRUSTED PUBLISHING (optional, no stored token): drop the `password:` input, add `id-token: write`
# to the publish job's permissions, and register a PyPI trusted publisher for BDR-Pro/petabyte-client
# workflow release.yml environment prod.
